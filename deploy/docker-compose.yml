# Smart Access — bitta buyruq bilan ishga tushirish (CLAUDE.md 10-bo'lim):
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
# api va caddy xizmatlari tegishli modullar qurilgach yoqiladi (progress.md 0-band izohi).

name: smartaccess

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # VMS — korxona ichidagi serverda ishlaydi (gibrid sxema, docs/decisions.md ADR-002).
  mediamtx:
    image: bluenviron/mediamtx:1.12.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8554:8554"   # RTSP
      - "127.0.0.1:8889:8889"   # WebRTC
      - "127.0.0.1:8888:8888"   # HLS
      - "127.0.0.1:9997:9997"   # API

volumes:
  pg_data:
  redis_data:
  minio_data:
